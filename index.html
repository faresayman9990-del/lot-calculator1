<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة حجم الصفقة - Lot Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-card {
            background-color: #1e293b;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            border: 1px solid #334155;
        }

        h2 {
            text-align: center;
            margin-bottom: 22px;
            color: #38bdf8;
            font-size: 22px;
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        .input-group {
            margin-bottom: 16px;
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .result-box {
            background-color: #0f172a;
            padding: 18px;
            border-radius: 10px;
            border: 1px solid #0284c7;
            text-align: center;
            margin-top: 20px;
        }

        .result-title {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .result-value {
            font-size: 30px;
            font-weight: bold;
            color: #38bdf8;
        }

        .error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        hr {
            border: none;
            border-top: 1px solid #334155;
            margin: 18px 0;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2> LOT-CALCULATOR </h2>
    
    <!-- حساب الفرق بين سعر الدخول وسعر الخروج -->
    <div class="input-row">
        <div class="input-group">
            <label for="entryPrice">ENTRY POINT</label>
            <input type="number" step="any" id="entryPrice" placeholder="0.00">
        </div>
        <div class="input-group">
            <label for="exitPrice">STOP POINET</label>
            <input type="number" step="any" id="exitPrice" placeholder="0.00">
        </div>
    </div>

    <hr>

    <!-- عدد النقاط (يتم حسابه تلقائياً أو إدخاله مباشرة) -->
    <div class="input-group">
        <label for="points">عدد النقاط (Points)</label>
        <input type="number" step="any" id="points" placeholder="الفرق أو أدخل النقاط مباشرة">
    </div>

    <!-- وقف الخسارة -->
    <div class="input-group">
        <label for="stopLoss">وقف الخسارة (Stop Loss)</label>
        <input type="number" step="any" id="stopLoss" placeholder="دخل انت عايز ستوب كام">
        <div id="error" class="error">لا يمكن القسمة على الصفر</div>
    </div>

    <!-- الناتج النهائي -->
    <div class="result-box">
        <div class="result-title">حجم اللوت (Lot)</div>
        <div id="lotResult" class="result-value">0.00</div>
    </div>
</div>

<script>
    // التشغيل بعد تحميل عناصر الصفحة لضمان عدم حدوث خطأ null على StackBlitz أو GitHub
    document.addEventListener('DOMContentLoaded', function () {
        const entryInput = document.getElementById('entryPrice');
        const exitInput = document.getElementById('exitPrice');
        const pointsInput = document.getElementById('points');
        const stopLossInput = document.getElementById('stopLoss');
        const resultDisplay = document.getElementById('lotResult');
        const errorDisplay = document.getElementById('error');

        function calculateAll() {
            const entryPrice = parseFloat(entryInput.value);
            const exitPrice = parseFloat(exitInput.value);

            if (!isNaN(entryPrice) && !isNaN(exitPrice)) {
                const diff = Math.abs(entryPrice - exitPrice);
                pointsInput.value = Number.isInteger(diff) ? diff : diff.toFixed(4);
            }
            calculateLot();
        }

        function calculateLot() {
            const points = parseFloat(pointsInput.value);
            const stopLoss = parseFloat(stopLossInput.value);

            if (isNaN(points) || isNaN(stopLoss)) {
                resultDisplay.textContent = '0.00';
                errorDisplay.style.display = 'none';
                return;
            }

            if (stopLoss === 0) {
                resultDisplay.textContent = '0.00';
                errorDisplay.style.display = 'block';
                return;
            }

            errorDisplay.style.display = 'none';
            const lot = points / stopLoss;
            resultDisplay.textContent = Number.isInteger(lot) ? lot : lot.toFixed(2);
        }

        entryInput.addEventListener('input', calculateAll);
        exitInput.addEventListener('input', calculateAll);
        pointsInput.addEventListener('input', calculateLot);
        stopLossInput.addEventListener('input', calculateLot);
    });
</script>

</body>
</html>
